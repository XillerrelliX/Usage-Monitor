name: Mac packages and cross-platform tests

on:
  push:
    branches: [feature/macos-packages]
    paths:
      - 'usage-monitor/**'
      - 'ci/**'
      - '.github/workflows/macos.yml'
      - '!usage-monitor/Start-Usage-Monitor.command'
      - '!usage-monitor/bundle-manifest.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-validation-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[mac-validation-only]') && 'mac' || contains(github.event.head_commit.message, '[windows-validation-only]') && 'windows' || 'all' }}
  cancel-in-progress: true

jobs:
  macos:
    if: ${{ !contains(github.event.head_commit.message, '[windows-validation-only]') }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare test tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          command -v zstd || brew install zstd
          npm ci --prefix ci
          cd ci
          npx playwright install chromium webkit
      - name: Build and test the actual Mac package
        run: >-
          python -B -X utf8 ci/build_and_test_macos.py
          --platform '${{ matrix.platform }}'
          --artifacts-dir '${{ runner.temp }}/usage-artifacts-${{ matrix.platform }}'
          --browser-node "$(command -v node)"
      - name: Preserve packages and complete test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usage-monitor-${{ matrix.platform }}
          path: ${{ runner.temp }}/usage-artifacts-${{ matrix.platform }}/publish/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[mac-validation-only]') }}
    name: Windows regression tests
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test the unchanged Windows engine with the shared application
        if: ${{ !contains(github.event.head_commit.message, '[windows-resume]') }}
        run: python -B -X utf8 ci/windows_gate.py --artifacts-dir '${{ runner.temp }}/usage-artifacts-windows'
      - name: Retrieve the exact previous full Windows coverage
        if: ${{ contains(github.event.head_commit.message, '[windows-resume]') }}
        id: baseline
        shell: pwsh
        run: |
          $baseline = Get-Content -LiteralPath ci/windows-resume-baseline.json -Raw | ConvertFrom-Json
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runId=$($baseline.runId)"
      - name: Download the pinned Windows baseline
        if: ${{ contains(github.event.head_commit.message, '[windows-resume]') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: usage-monitor-windows-tests
          run-id: ${{ steps.baseline.outputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/windows-baseline
      - name: Complete the single failed original method and preserve prior successes
        if: ${{ contains(github.event.head_commit.message, '[windows-resume]') }}
        run: |
          $baseline = Get-Content -LiteralPath ci/windows-resume-baseline.json -Raw | ConvertFrom-Json
          python -B -X utf8 ci/windows_resume.py --baseline-evidence-zip '${{ runner.temp }}/windows-baseline/validation-evidence.zip' --baseline-sha256 $baseline.evidenceSha256 --baseline-source-commit $baseline.sourceCommit --baseline-run-id $baseline.runId --artifacts-dir '${{ runner.temp }}/usage-artifacts-windows'
          exit $LASTEXITCODE
      - name: Preserve Windows regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usage-monitor-windows-tests
          path: ${{ runner.temp }}/usage-artifacts-windows/publish/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
