[package]
name = "codex-usage-offline"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Pinned upstream Codex usage scanner with an offline-only CLI and private cache"
publish = false
build = "build.rs"

[lib]
name = "upstream_scanner_tests"
path = "src/lib.rs"

[[bin]]
name = "codex-usage-offline"
path = "src/main.rs"
test = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.13", default-features = false }
url = "2"

[profile.release]
strip = true

